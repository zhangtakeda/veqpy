name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-smoke:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Cxx Kernel native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang-18 \
            cmake \
            git \
            liblapacke-dev \
            libopenblas-dev
          git clone --depth 1 --branch v1.18.0 https://github.com/kthohr/gcem.git "${RUNNER_TEMP}/gcem"
          cmake -S "${RUNNER_TEMP}/gcem" -B "${RUNNER_TEMP}/gcem-build" \
            -DCMAKE_INSTALL_PREFIX="${HOME}/opt/gcem-install"
          cmake --build "${RUNNER_TEMP}/gcem-build" --target install

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q veqpy tests benchmarks demo.py

      - name: Lint with Ruff
        run: ruff check veqpy tests benchmarks demo.py

      - name: Run tests
        run: pytest

      - name: Build source and wheel distributions
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Install wheel in an isolated virtual environment
        shell: bash
        run: |
          smoke_env="${RUNNER_TEMP}/veqpy-wheel-smoke-${{ matrix.python-version }}"
          smoke_import_dir="$(mktemp -d "${RUNNER_TEMP}/veqpy-wheel-import-XXXXXX")"
          wheel_path="$(ls dist/*.whl)"
          python -m venv "${smoke_env}"
          "${smoke_env}/bin/python" -m pip install --upgrade pip
          "${smoke_env}/bin/python" -m pip install "${wheel_path}"
          cd "${smoke_import_dir}"
          "${smoke_env}/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import os
          from importlib.resources import files
          from pathlib import Path

          import veqpy
          from veqpy import Kernel, KernelBoundary, KernelRecipe, KernelSource, KernelTopology
          from veqpy.model import Grid

          module_path = Path(veqpy.__file__).resolve()
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          if workspace == module_path or workspace in module_path.parents:
              raise SystemExit(f"imported veqpy from source tree instead of installed wheel: {module_path}")

          print("veqpy distribution", metadata.version("veqpy"))
          print("veqpy module", module_path)
          print(
              "smoke symbols",
              Grid.__name__,
              Kernel.__name__,
              KernelBoundary.__name__,
              KernelRecipe.__name__,
              KernelSource.__name__,
              KernelTopology.__name__,
          )

          topology = KernelTopology(
              h_count=1,
              v_count=0,
              kappa_count=0,
              psin_count=1,
              F_count=0,
              c_counts=(),
              s_counts=(),
              Nr=4,
              Nt=4,
              route="PF",
              coordinate="psin",
              nodes="uniform",
              constraint="ip",
              sample_count=5,
          )
          prepared = Kernel(
              topology=topology,
              recipe=KernelRecipe(backend="cxx"),
          ).prepare(dry_run=True)
          if not prepared.dry_run or prepared.prepared or prepared.backend != "cxx":
              raise SystemExit(f"unexpected Cxx dry-run result: {prepared!r}")
          expected_sources = {
              "CMakeLists.txt",
              "bindings.cpp",
              "kernel_runtime.h",
              "minpack/CopyrightMINPACK.txt",
              "minpack/dogleg.c",
              "minpack/inline_lm.h",
              "minpack/inline_powell.h",
          }
          cxx_core = files("veqpy.kernels.cxx_kernel") / "core"
          missing = sorted(
              name
              for name in expected_sources
              if not cxx_core.joinpath(*name.split("/")).is_file()
          )
          if missing:
              raise SystemExit(f"Cxx core package data missing from wheel: {missing}")
          source_file_count = prepared.artifact.metadata["build_identity"]["cxx_source_digest"][
              "file_count"
          ]
          if source_file_count < len(expected_sources):
              raise SystemExit(f"Cxx source digest did not see packaged core files: {source_file_count}")
          print("cxx dry-run artifact", prepared.artifact.artifact_id)
          PY
