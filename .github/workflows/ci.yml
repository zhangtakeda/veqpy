name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-build-smoke:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Cxx Kernel native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ca-certificates \
            cmake \
            curl \
            git \
            gnupg \
            libcminpack-dev \
            liblapacke-dev \
            libopenblas-dev
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/apt.llvm.org.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-22 lld-22 llvm-22-dev
          clang++-22 --version
          git clone --depth 1 --branch v1.18.0 https://github.com/kthohr/gcem.git "${RUNNER_TEMP}/gcem"
          cmake -S "${RUNNER_TEMP}/gcem" -B "${RUNNER_TEMP}/gcem-build" \
            -DCMAKE_INSTALL_PREFIX="${HOME}/opt/gcem-install"
          cmake --build "${RUNNER_TEMP}/gcem-build" --target install

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q veqpy benchmarks demo.py demo_geqdsk.py

      - name: Lint with Ruff
        run: ruff check veqpy benchmarks demo.py demo_geqdsk.py

      - name: Run CLI and Numba structural smoke
        run: |
          python -m veqpy --version
          python -m veqpy --links
          python -m veqpy --check

      - name: Run Cxx backend smoke
        run: |
          python -m veqpy --demo cxx-strict
          python -m veqpy --demo cxx-relaxed

      - name: Build source and wheel distributions
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Install wheel in an isolated virtual environment
        shell: bash
        run: |
          smoke_env="${RUNNER_TEMP}/veqpy-wheel-smoke-${{ matrix.python-version }}"
          smoke_import_dir="$(mktemp -d "${RUNNER_TEMP}/veqpy-wheel-import-XXXXXX")"
          wheel_path="$(ls dist/*.whl)"
          python -m venv "${smoke_env}"
          "${smoke_env}/bin/python" -m pip install --upgrade pip
          "${smoke_env}/bin/python" -m pip install "${wheel_path}"
          cd "${smoke_import_dir}"
          "${smoke_env}/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import os
          from importlib.resources import files
          from pathlib import Path

          import veqpy

          module_path = Path(veqpy.__file__).resolve()
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          if workspace == module_path or workspace in module_path.parents:
              raise SystemExit(f"imported veqpy from source tree instead of installed wheel: {module_path}")
          forbidden = {"KernelTopology", "KernelInput", "KernelConfig", "KernelOutput", "Geqdsk"}
          leaked = sorted(forbidden.intersection(dir(veqpy)))
          if leaked:
              raise SystemExit(f"private symbols leaked from installed wheel: {leaked}")

          print("veqpy distribution", metadata.version("veqpy"))
          print("veqpy module", module_path)
          expected_sources = {
              "CMakeLists.txt",
              "bindings.cpp",
              "kernel_runtime.h",
              "minpack/CopyrightMINPACK.txt",
              "minpack/dogleg.c",
              "minpack/inline_lm.h",
              "minpack/inline_powell.h",
          }
          cxx_core = files("veqpy.kernels.cxx_kernel") / "core"
          missing = sorted(
              name
              for name in expected_sources
              if not cxx_core.joinpath(*name.split("/")).is_file()
          )
          if missing:
              raise SystemExit(f"Cxx core package data missing from wheel: {missing}")
          print("installed wheel structural smoke passed")
          PY
