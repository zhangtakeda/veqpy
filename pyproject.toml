[build-system]
requires = [
    "setuptools>=84",
    "wheel>=0.47",
]
build-backend = "setuptools.build_meta"

[project]
name = "veqpy"
version = "2.0.0.dev0"
description = "VEQPy — FusionPRIME fixed-boundary equilibrium Module"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "rhzhang", email = "rhzhang@mail.dlut.edu.cn"},
]
requires-python = ">=3.12"
keywords = [
    "Grad-Shafranov",
    "equilibrium",
    "fusion",
    "tokamak",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "fusionprime-base>=0.1.0.dev0,<0.2",
    "numpy>=2.0",
    "orjson>=3.11",
    "scipy>=1.18",
    "numba>=0.67",
    "rich>=15",
]

[project.optional-dependencies]
dev = [
    "build>=1.5",
    "packaging>=26.3",
    "ruff>=0.15.22",
    "twine>=7",
    "nanobind>=2.13",
    "openmdao>=3.45",
]

[project.urls]
Homepage = "https://zhangtakeda.github.io"
Repository = "https://github.com/zhangtakeda/veqpy"
Issues = "https://github.com/zhangtakeda/veqpy/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["veqpy*"]
namespaces = false

[tool.setuptools.package-data]
"veqpy.kernels.cxx_kernel" = [
    "core/*.cpp",
    "core/*.h",
    "core/*.in",
    "core/CMakeLists.txt",
    "core/THIRD_PARTY_NOTICES",
    "core/minpack/*.c",
    "core/minpack/*.h",
    "core/minpack/*.txt",
    "core/lapack/*.txt",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
